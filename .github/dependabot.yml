# Workflow actions are pinned to commit SHAs (see .github/workflows/ci.yml), so
# they never move on their own. Dependabot opens one grouped PR a month that
# bumps each SHA and its trailing version comment together. The cooldown skips
# releases younger than a week, so a hijacked release has time to be pulled.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ['*']
