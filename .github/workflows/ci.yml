name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Incremental main pushes must not continually restart the full API/E2E run.
  # Keep the active main run and the latest pending revision; supersede PR runs.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MONGODB_TEST_URI: mongodb://127.0.0.1:28017/ubuntu-fund-test
  JWT_SECRET: ci-only-jwt-secret-not-used-in-production-0000000000
  JWT_REFRESH_SECRET: ci-only-refresh-secret-not-used-in-production-1111
  MONGODB_URI: mongodb://127.0.0.1:28017/ubuntu-fund-e2e

jobs:
  ci:
    name: Lint, Type Check, Test, Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Use the repository npm version
        run: npm install --global npm@12.0.2

      - name: Install dependencies
        run: npm ci

      - name: Verify dependency security patches
        run: npm run test:dependency-security

      - name: Start MongoDB replica set for transactional payment tests
        run: |
          docker run --detach --name ujimora-ci-mongo --publish 28017:28017 mongo:7 \
            mongod --port 28017 --replSet ujimora-ci --bind_ip_all
          for i in $(seq 1 30); do
            docker exec ujimora-ci-mongo mongosh --port 28017 --quiet \
              --eval 'db.runCommand({ ping: 1 })' && break
            sleep 1
          done
          docker exec ujimora-ci-mongo mongosh --port 28017 --quiet --eval \
            'rs.initiate({ _id: "ujimora-ci", members: [{ _id: 0, host: "127.0.0.1:28017" }] })'
          for i in $(seq 1 30); do
            if docker exec ujimora-ci-mongo mongosh --port 28017 --quiet \
              --eval 'quit(db.hello().isWritablePrimary ? 0 : 1)'; then
              exit 0
            fi
            sleep 1
          done
          docker logs ujimora-ci-mongo
          exit 1

      - name: Lint
        run: npx turbo lint

      - name: Type check
        run: npx turbo type-check

      - name: Test
        run: npx turbo test --concurrency=1

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Start API for E2E
        run: |
          PORT=8100 npm start -w @ubuntu-fund/api &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8100/health && break
            sleep 2
          done
          curl -sf http://localhost:8100/health

      - name: Seed E2E data
        run: node scripts/seed-e2e.mjs
        working-directory: apps/api

      - name: E2E tests
        run: npx turbo e2e

      - name: Build
        run: npx turbo build
