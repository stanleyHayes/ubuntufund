<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Primary Meta Tags -->
    <title>Ujimora — Trusted Crowdfunding in Ghana</title>
    <meta name="title" content="Ujimora — Trusted Crowdfunding in Ghana" />
    <meta name="description" content="Ujimora is Ghana&apos;s trust infrastructure for giving. Discover and support verified campaigns across Ghana. Together, we fund what matters." />
    <meta name="keywords" content="crowdfunding, Ghana, donations, fundraising, trust, giving, campaigns, Ujima, community" />
    <meta name="author" content="Ujimora" />
    <meta name="theme-color" content="#2E3D2F" />
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <!-- Favicon (square, solid tile; .ico first so Google & browsers resolve it) -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://app.ujimora.com/" />
    <meta property="og:title" content="Ujimora — Trusted Crowdfunding in Ghana" />
    <meta property="og:description" content="Ghana&apos;s trust infrastructure for giving. Discover and support verified campaigns across Ghana. Together, we fund what matters." />
    <meta property="og:image" content="https://ujimora.com/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Ujimora — Trusted crowdfunding in Ghana" />
    <meta property="og:site_name" content="Ujimora" />
    <meta property="og:locale" content="en_GH" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@ujimora" />
    <meta name="twitter:url" content="https://app.ujimora.com/" />
    <meta name="twitter:title" content="Ujimora — Trusted Crowdfunding in Ghana" />
    <meta name="twitter:description" content="Ghana&apos;s trust infrastructure for giving. Discover and support verified campaigns across Ghana. Together, we fund what matters." />
    <meta name="twitter:image" content="https://ujimora.com/og-image.png" />
    <meta name="twitter:image:alt" content="Ujimora — Trusted crowdfunding in Ghana" />

    <!-- Canonical is set per route at runtime (src/hooks/useSeo.ts).
         Deliberately absent here: vercel.json rewrites /(.*) -> / so this head is
         served for every path, and a static canonical pointing at the marketing
         homepage told Google that every campaign, creator and organization page
         was a duplicate of ujimora.com/ — a cross-domain canonical Google
         honours, which made the whole long-tail surface ineligible to rank.
         With none present, Google self-canonicalises until the hook supplies
         the real URL. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
