<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <!-- Ground -->
  <rect width="1200" height="630" fill="#F2EFEA"/>

  <!-- Top forest strip + kente accent bar (house device) -->
  <rect width="1200" height="6" fill="#2E3D2F"/>
  <rect x="0"   y="6" width="300" height="3" fill="#2E3D2F"/>
  <rect x="300" y="6" width="300" height="3" fill="#C7A24A"/>
  <rect x="600" y="6" width="300" height="3" fill="#8B6F4E"/>
  <rect x="900" y="6" width="300" height="3" fill="#1C261D"/>

  <!-- Faint motif watermark: oversized brand mark, bottom-right -->
  <g transform="translate(940, 360) scale(9)" opacity="0.06">
    <rect x="30" y="10" width="28" height="28" rx="11" transform="rotate(45 44 24)" fill="none" stroke="#2E3D2F" stroke-width="4"/>
    <rect x="8"  y="10" width="28" height="28" rx="3"  transform="rotate(45 22 24)" fill="none" stroke="#2E3D2F" stroke-width="4"/>
  </g>

  <!-- Brand mark (two rotated squares — sage + gold) -->
  <g transform="translate(96, 232) scale(3.5)">
    <rect x="30" y="10" width="28" height="28" rx="11" transform="rotate(45 44 24)" fill="none" stroke="#A8B5A0" stroke-width="4"/>
    <rect x="8"  y="10" width="28" height="28" rx="3"  transform="rotate(45 22 24)" fill="none" stroke="#C7A24A" stroke-width="4"/>
    <path d="M 33.5 13.5 A 11 11 0 0 1 38 11.2" fill="none" stroke="#A8B5A0" stroke-width="4" stroke-linecap="round" transform="rotate(45 44 24)"/>
  </g>

  <!-- Eyebrow -->
  <text x="322" y="272" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="700" letter-spacing="4" fill="#8B6F4E">GHANA&#8217;S TRUST INFRASTRUCTURE FOR GIVING</text>

  <!-- Wordmark -->
  <text x="320" y="352" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-size="86" font-weight="900" fill="#2E3D2F">Ujimora</text>

  <!-- Tagline -->
  <text x="322" y="404" font-family="'Helvetica Neue', Arial, sans-serif" font-size="32" font-weight="500" fill="#4A4A42">Together, we fund what matters.</text>

  <!-- Bottom forest strip -->
  <rect y="624" width="1200" height="6" fill="#2E3D2F"/>
</svg>
