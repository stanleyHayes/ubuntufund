<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Solid forest tile so the mark stays visible on light OR dark search chips -->
  <rect width="48" height="48" rx="11" fill="#2E3D2F"/>
  <!-- Brand mark: two rotated squares (sage + gold), centred and enlarged for small sizes -->
  <g transform="translate(24 24) scale(0.58) translate(-33 -24)">
    <rect x="30" y="10" width="28" height="28" rx="11" transform="rotate(45 44 24)" fill="none" stroke="#A8B5A0" stroke-width="5"/>
    <rect x="8"  y="10" width="28" height="28" rx="3"  transform="rotate(45 22 24)" fill="none" stroke="#C7A24A" stroke-width="5"/>
    <path d="M 33.5 13.5 A 11 11 0 0 1 38 11.2" fill="none" stroke="#A8B5A0" stroke-width="5" stroke-linecap="round" transform="rotate(45 44 24)"/>
  </g>
</svg>
