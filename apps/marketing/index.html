<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Pages ship prerendered in the default look (light, neumorphism). For a
         visitor who saved a different theme, src/main.tsx renders the page
         fresh in their theme; until then this keeps the prerendered page
         hidden instead of flashing the wrong one. The 3s reveal is a backstop
         in case the app never starts. Mirrors prefersNonDefaultLook() in
         src/lib/hydration.ts (a test holds the two together). -->
    <script>
      try {
        var mode = localStorage.getItem('uf_color_mode'), skin = localStorage.getItem('uf_skin');
        if (mode === 'dark') document.documentElement.setAttribute('data-restyle', 'dark');
        else if (skin === 'claymorphism' || skin === 'glassmorphism' || skin === 'minimal') document.documentElement.setAttribute('data-restyle', 'skin');
      } catch (e) {}
    </script>
    <style>
      html[data-restyle] #root { visibility: hidden; animation: uf-restyle-reveal 0s linear 3s forwards; }
      html[data-restyle='dark'] body { background-color: #172019; }
      @keyframes uf-restyle-reveal { to { visibility: visible; } }
    </style>

    <!-- Primary Meta Tags -->
    <title>Ujimora - Ghana's Trust Infrastructure for Giving</title>
    <meta name="title" content="Ujimora - Ghana's Trust Infrastructure for Giving" />
    <meta name="description" content="Ujimora is Ghana's crowdfunding platform built on trust: reviewed campaigns, verified organizers and transparent donation records. Together, we fund what matters." />
    <meta name="keywords" content="crowdfunding, Ghana, donations, fundraising, trust, giving, campaigns, Ujima, community, verified, transparent, mobile money, MoMo" />
    <meta name="author" content="Ujimora" />
    <meta name="theme-color" content="#2E3D2F" />
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <!-- Resource hints. The Outfit @font-face rules are injected by JavaScript
         at runtime, so without this the browser cannot discover the font until
         React mounts — first paint uses the fallback face and reflows when
         Outfit arrives. Only the latin subset is preloaded; latin-ext covers
         accented Latin most visitors never render.

         images.unsplash.com serves the blog and editorial imagery. -->
    <link rel="preload" href="/fonts/Outfit-Variable-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <link rel="dns-prefetch" href="https://images.unsplash.com" />

    <!-- Favicon (square, solid tile; .ico first so Google & browsers resolve it) -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ujimora.com/" />
    <meta property="og:title" content="Ujimora - Ghana's Trust Infrastructure for Giving" />
    <meta property="og:description" content="Ghana's crowdfunding platform built on trust: reviewed campaigns, verified organizers and transparent donation records." />
    <meta property="og:image" content="https://ujimora.com/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Ujimora — Ghana's trust infrastructure for giving" />
    <meta property="og:site_name" content="Ujimora" />
    <meta property="og:locale" content="en_GH" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://ujimora.com/" />
    <meta name="twitter:title" content="Ujimora - Ghana's Trust Infrastructure for Giving" />
    <meta name="twitter:description" content="Ghana's crowdfunding platform built on trust: reviewed campaigns, verified organizers and transparent donation records." />
    <meta name="twitter:image" content="https://ujimora.com/og-image.png" />
    <meta name="twitter:image:alt" content="Ujimora — Ghana's trust infrastructure for giving" />

    <!-- Canonical -->
    <link rel="canonical" href="https://ujimora.com/" />

    <!-- Structured data: Organization + WebSite, on every page. The build
         (scripts/prerender.ts) adds `sameAs` from the social profiles set in
         Admin → Content → Contact; a profile URL is only ever claimed here once
         the owner has entered it there. -->
    <script type="application/ld+json" id="site-jsonld">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://ujimora.com/#organization",
          "name": "Ujimora",
          "url": "https://ujimora.com/",
          "logo": { "@type": "ImageObject", "url": "https://ujimora.com/favicon-512x512.png", "width": 512, "height": 512 },
          "image": "https://ujimora.com/og-image.png",
          "description": "Ghana's crowdfunding platform built on trust: reviewed campaigns, verified organizers and transparent donation records.",
          "email": "info@ujimora.com",
          "contactPoint": { "@type": "ContactPoint", "contactType": "customer support", "email": "support@ujimora.com", "areaServed": "GH", "availableLanguage": "en" },
          "areaServed": { "@type": "Country", "name": "Ghana" }
        },
        {
          "@type": "WebSite",
          "@id": "https://ujimora.com/#website",
          "url": "https://ujimora.com/",
          "name": "Ujimora",
          "description": "Ghana's trust infrastructure for giving.",
          "publisher": { "@id": "https://ujimora.com/#organization" },
          "inLanguage": "en-GH"
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
