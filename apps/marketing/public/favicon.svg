<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Single arm path: a curved forearm reaching clockwise -->
    <!-- Starts from outer (elbow/shoulder area) and curves to grip point -->
    <path id="arm" d="M0,-16 C6,-14 12,-8 12,-1 C12,2 10,4 7,4" />
  </defs>
  <circle cx="32" cy="32" r="30" fill="#2E7D32"/>
  <!-- Subtle ring -->
  <circle cx="32" cy="32" r="20" fill="none" stroke="#4CAF50" stroke-width="0.8" opacity="0.3"/>
  <!-- Three arms, each rotated 120° -->
  <g transform="translate(32,32)" fill="none" stroke="white" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <use href="#arm"/>
    <use href="#arm" transform="rotate(120)"/>
    <use href="#arm" transform="rotate(240)"/>
  </g>
  <!-- Gold dots at the three grip points -->
  <!-- Arm tip is at local (7, 4), rotated 0°/120°/240° then translated to center (32,32) -->
  <!-- 0°:   (32+7, 32+4) = (39, 36) -->
  <!-- 120°: rotate(7,4) by 120° → (-5.46, -7.06) → (26.5, 24.9) -->
  <!-- 240°: rotate(7,4) by 240° → (-1.54, 7.06) → (30.5, 39.1) -->
  <circle cx="39" cy="36" r="2.8" fill="#F9A825"/>
  <circle cx="26.5" cy="24.9" r="2.8" fill="#F9A825"/>
  <circle cx="30.5" cy="39.1" r="2.8" fill="#F9A825"/>
</svg>
