# Render Blueprint — free-tier deployment of the Ujimora API.
# Apply at https://dashboard.render.com/blueprints (New > Blueprint) after
# connecting the GitHub repo. MongoDB is not offered on Render's free tier:
# create a free MongoDB Atlas M0 cluster and paste its URI into MONGODB_URI.
services:
  - type: web
    name: ujimora-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start -w @ubuntu-fund/api
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false # paste your Atlas connection string in the dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        # comma-separated browser origins allowed to call the API
        value: https://ujimora.com,https://www.ujimora.com,https://app.ujimora.com,https://admin.ujimora.com
      # Public base URLs — build canonical /c/:slug links, QR short-links, and the
      # Paystack donor callback. Point these at your live domains.
      - key: PUBLIC_WEB_URL
        value: https://app.ujimora.com
      - key: PUBLIC_API_URL
        value: https://api.ujimora.com
      # Paystack (card + mobile money in GHS). Paste live keys in the dashboard —
      # never commit them. Blank = Paystack rail disabled, wallet rail still works.
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      # Cloudinary — image/PDF uploads (KYC documents, campaign covers) go through
      # the server-side signed proxy (POST /uploads/image), so the API needs the
      # account credentials. Reusing the dev cloud for now: the cloud name is
      # public (it also ships in the web bundle), but paste the API key + secret
      # in the dashboard — same values as dev; never commit the secret.
      - key: CLOUDINARY_CLOUD_NAME
        value: dvoqbonr2
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # ── Commercial config (fees, limits, flags). All non-secret, so they are
      # committed literals set to the API's built-in defaults — made explicit so
      # prod never runs on a hidden default. Blank numeric values would parse to
      # NaN, so these are literals, not sync:false; edit here + redeploy to change.
      - key: SPLIT_PROCEEDS_ENABLED
        value: "true" # split-proceeds campaigns ON in prod (§6 cleared)
      - key: LOG_LEVEL
        value: info
      # Preview/estimate fees only — the real Paystack fee comes from the webhook.
      - key: PLATFORM_FEE_PERCENT
        value: "0" # platform fee is plan-driven (Community 3.5% … Org 2.0%); this is a fallback
      - key: PAYSTACK_FEE_PERCENT
        value: "0"
      - key: PAYSTACK_FLAT_FEE
        value: "0"
      - key: TIP_PLATFORM_FEE_PERCENT
        value: "0"
      # Payment rails / currencies (multi-rail flags default OFF).
      - key: PAYMENTS_PAYSTACK_ENABLED
        value: "true"
      - key: PAYMENTS_FLUTTERWAVE_ENABLED
        value: "false"
      - key: PAYMENTS_INTERNATIONAL_CARDS_ENABLED
        value: "false"
      - key: PAYMENTS_MULTI_CURRENCY_ENABLED
        value: "false"
      - key: PAYMENTS_DEFAULT_PROVIDER
        value: paystack
      - key: PAYMENTS_RECONCILIATION_ENABLED
        value: "true" # scheduled payout/tip reconciliation sweep ON in prod
      - key: PAYMENTS_SUPPORTED_CURRENCIES
        value: "GHS,USD,GBP,EUR,CAD"
      - key: PAYMENTS_FX_SOURCE
        value: provider
      # Flutterwave rail — secrets; blank = rail disabled (safe). Paste in the
      # dashboard only when you enable Flutterwave.
      - key: FLUTTERWAVE_SECRET_KEY
        sync: false
      - key: FLUTTERWAVE_PUBLIC_KEY
        sync: false
      - key: FLUTTERWAVE_WEBHOOK_SECRET_HASH
        sync: false
      # Affiliate program (one-time commission on first paid subscription).
      - key: AFFILIATE_COMMISSION_PERCENT
        value: "10"
      - key: AFFILIATE_HOLD_DAYS
        value: "14"
      # Campaign tiering — GHS goal thresholds (tiers 1–5); auto-approve ≤ tier N.
      - key: CAMPAIGN_TIER_THRESHOLDS
        value: "10000,50000,250000,1000000"
      - key: CAMPAIGN_AUTO_APPROVE_MAX_TIER
        value: "2"
      # Payout service fees / limits (GHS) — these match the published Payout &
      # Refund policy (priority 0.5% / early 1.0% / urgent 1.5% / assisted 1.5%+50,
      # 80% early-withdrawal ceiling, dual-approval disabled at 0).
      - key: PAYOUT_PRIORITY_FEE_PERCENT
        value: "0.5"
      - key: PAYOUT_PRIORITY_MIN_FEE
        value: "10"
      - key: PAYOUT_EARLY_FEE_PERCENT
        value: "1.0"
      - key: PAYOUT_EARLY_MIN_FEE
        value: "20"
      - key: PAYOUT_URGENT_FEE_PERCENT
        value: "1.5"
      - key: PAYOUT_URGENT_MIN_FEE
        value: "30"
      - key: PAYOUT_ASSISTED_FEE_PERCENT
        value: "1.5"
      - key: PAYOUT_ASSISTED_FIXED_FEE
        value: "50"
      - key: PAYOUT_EARLY_MAX_WITHDRAWAL_PERCENT
        value: "80"
      - key: PAYOUT_MAX_TRANSFER_AMOUNT
        value: "50000"
      - key: PAYOUT_DUAL_APPROVAL_AMOUNT
        value: "0"
      # ── Crypto donation rail (2nd payment rail). Ships OFF: keep
      # CRYPTO_PAYMENTS_ENABLED "false" until a real provider is onboarded and
      # the Ghana legal review clears. Non-secret settings are committed literals
      # (numeric ones MUST be literals, not blank — blank parses to NaN). Flip
      # ENABLED to "true" and set PRIMARY_PROVIDER to the live provider when ready.
      - key: CRYPTO_PAYMENTS_ENABLED
        value: "false"
      - key: CRYPTO_PRIMARY_PROVIDER
        value: mock # swap to yellowcard | paychant | bitnob when a real adapter lands
      - key: CRYPTO_ALLOWED_ASSETS
        value: "USDT,USDC"
      - key: CRYPTO_MIN_GHS
        value: "10"
      - key: CRYPTO_MAX_GHS
        value: "100000"
      - key: CRYPTO_QUOTE_TTL_SECONDS
        value: "900"
      # Provider webhook signing secret — paste in the dashboard only when you
      # enable a crypto provider (blank = mock/dev default; rail is OFF anyway).
      - key: CRYPTO_MOCK_WEBHOOK_SECRET
        sync: false
