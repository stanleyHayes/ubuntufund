# Render Blueprint — free-tier deployment of the Ujimora API.
# Apply at https://dashboard.render.com/blueprints (New > Blueprint) after
# connecting the GitHub repo. MongoDB is not offered on Render's free tier:
# create a free MongoDB Atlas M0 cluster and paste its URI into MONGODB_URI.
services:
  - type: web
    name: ujimora-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start -w @ubuntu-fund/api
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false # paste your Atlas connection string in the dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        # comma-separated browser origins allowed to call the API
        value: https://ujimora.com,https://www.ujimora.com,https://app.ujimora.com,https://admin.ujimora.com
      # Public base URLs — build canonical /c/:slug links, QR short-links, and the
      # Paystack donor callback. Point these at your live domains.
      - key: PUBLIC_WEB_URL
        value: https://app.ujimora.com
      - key: PUBLIC_API_URL
        value: https://api.ujimora.com
      # Paystack (card + mobile money in GHS). Paste live keys in the dashboard —
      # never commit them. Blank = Paystack rail disabled, wallet rail still works.
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      # Cloudinary — image/PDF uploads (KYC documents, campaign covers) go through
      # the server-side signed proxy (POST /uploads/image), so the API needs the
      # account credentials. Reusing the dev cloud for now: the cloud name is
      # public (it also ships in the web bundle), but paste the API key + secret
      # in the dashboard — same values as dev; never commit the secret.
      - key: CLOUDINARY_CLOUD_NAME
        value: dvoqbonr2
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
